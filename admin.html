<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | EventLux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        <div class="flex items-center justify-between glass p-6 rounded-2xl border border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-gauge text-white"></i>
                </div>
                <h1 class="text-xl font-extrabold text-white">Painel de Pedidos e Endereços</h1>
            </div>
            <button onclick="carregarPedidos()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-rotate"></i> <span>Atualizar Lista</span>
            </button>
        </div>

        <div class="glass rounded-2xl overflow-hidden border border-gray-800">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase bg-gray-900/50">
                            <th class="p-4">Data / Hora</th>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Contato (E-mail / CPF)</th>
                            <th class="p-4">Endereço de Montagem</th>
                            <th class="p-4">Valor / Pagamento</th>
                            <th class="p-4">Status / Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pedidos" class="divide-y divide-gray-800 text-sm">
                        <tr>
                            <td colspan="6" class="p-6 text-center text-gray-500">Carregando pedidos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-agendar" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="glass w-full max-w-md p-6 rounded-2xl border border-gray-800 space-y-4">
            <h3 id="modal-titulo" class="text-lg font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-calendar-check text-indigo-400"></i>
                <span>Enviar Mensagem</span>
            </h3>
            <input type="hidden" id="modal-pedido-id">
            <input type="hidden" id="modal-tipo-envio">
            <div id="grupo-data-horario" class="space-y-1">
                <label class="text-xs text-gray-400 font-semibold">Dia e Horário da Entrega:</label>
                <input type="text" id="modal-data-horario" placeholder="Ex: 15/08/2026 às 14:00" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-gray-400 font-semibold">Mensagem para o Cliente:</label>
                <textarea id="modal-mensagem" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"></textarea>
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="fecharModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-sm transition">Cancelar</button>
                <button onclick="enviarAgendamento()" class="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition">Salvar e Enviar</button>
            </div>
        </div>
    </div>

    <script>
        async function carregarPedidos() {
            const tbody = document.getElementById('tabela-pedidos');
            tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">Buscando dados...</td></tr>`;

            try {
                const response = await fetch('/api/pedidos');
                const pedidos = await response.json();

                if (pedidos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">Nenhum pedido registrado até o momento.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                pedidos.reverse().forEach(p => {
                    let statusHtml = '';
                    let statusDoPedido = p.statusAdmin || 'pendente_pagamento';

                    if (statusDoPedido === 'aprovado') {
                        statusHtml = `
                            <div class="mb-2">
                                <span class="px-2 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Pagamento Concluído</span>
                            </div>
                            <button onclick="abrirModal(${p.id}, 'aprovado')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs transition flex items-center space-x-1.5 whitespace-nowrap">
                                <i class="fa-solid fa-paper-plane"></i> <span>Enviar Agradecimento</span>
                            </button>
                        `;
                    } else if (statusDoPedido === 'visualizado') {
                        statusHtml = `
                            <div class="text-xs text-emerald-400 font-bold mb-1"><i class="fa-solid fa-check-double"></i> Aviso Enviado</div>
                        `;
                    } else {
                        statusHtml = `
                            <div class="mb-2">
                                <span class="px-2 py-1 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">Pagamento Pendente</span>
                            </div>
                            <button onclick="abrirModal(${p.id}, 'pendente')" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition flex items-center space-x-1.5 whitespace-nowrap">
                                <i class="fa-solid fa-paper-plane"></i> <span>Enviar Aviso</span>
                            </button>
                        `;
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/30 transition">
                            <td class="p-4 text-gray-300 whitespace-nowrap">${p.data}</td>
                            <td class="p-4 font-bold text-white">${p.payer.name}</td>
                            <td class="p-4 text-gray-300">
                                <div>${p.payer.email}</div>
                                <div class="text-xs text-gray-500">CPF: ${p.payer.cpf}</div>
                            </td>
                            <td class="p-4 text-gray-300">
                                <div>${p.address.street}, ${p.address.number}</div>
                                <div class="text-xs text-indigo-400">CEP: ${p.address.cep}</div>
                            </td>
                            <td class="p-4 whitespace-nowrap">
                                <div class="font-bold text-emerald-400">R$ ${p.transaction_amount.toFixed(2)}</div>
                                <div class="text-xs text-gray-400 uppercase font-semibold">Método: ${p.payment_method_id || 'pix'}</div>
                            </td>
                            <td class="p-4 whitespace-nowrap">${statusHtml}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar pedidos:", error);
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-400">Erro ao carregar os dados do servidor.</td></tr>`;
            }
        }

        function abrirModal(id, tipo) {
            document.getElementById('modal-pedido-id').value = id;
            document.getElementById('modal-tipo-envio').value = tipo;
            const campoMensagem = document.getElementById('modal-mensagem');
            const tituloModal = document.getElementById('modal-titulo');
            const grupoDataHorario = document.getElementById('grupo-data-horario');

            if (tipo === 'aprovado') {
                tituloModal.innerHTML = `<i class="fa-solid fa-calendar-check text-emerald-400"></i><span>Enviar Mensagem de Agradecimento</span>`;
                campoMensagem.value = "Muito obrigado pela preferência, pagamento confirmado com sucesso! Seus equipamentos serão enviados na data combinada. Qualquer dúvida estamos à disposição!";
                grupoDataHorario.style.display = 'block';
            } else {
                tituloModal.innerHTML = `<i class="fa-solid fa-bell text-indigo-400"></i><span>Enviar Aviso de Pagamento Pendente</span>`;
                campoMensagem.value = "Falta pouco para concluir o pagamento! 😊";
                grupoDataHorario.style.display = 'none';
            }

            document.getElementById('modal-agendar').classList.remove('hidden');
            document.getElementById('modal-agendar').classList.add('flex');
        }

        function fecharModal() {
            document.getElementById('modal-agendar').classList.remove('flex');
            document.getElementById('modal-agendar').classList.add('hidden');
        }

        async function enviarAgendamento() {
            const id = document.getElementById('modal-pedido-id').value;
            const tipo = document.getElementById('modal-tipo-envio').value;
            const dataHorarioEnvio = document.getElementById('modal-data-horario').value;
            const mensagemAgradecimento = document.getElementById('modal-mensagem').value;

            if (tipo === 'aprovado' && !dataHorarioEnvio) {
                alert('Por favor, preencha o dia e horário da entrega.');
                return;
            }

            try {
                const response = await fetch(`/api/pedidos/${id}/atualizar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dataHorarioEnvio: tipo === 'aprovado' ? dataHorarioEnvio : '', mensagemAgradecimento, tipoEnvio: tipo })
                });

                if (response.ok) {
                    fecharModal();
                    carregarPedidos();
                } else {
                    alert('Erro ao atualizar o pedido.');
                }
            } catch (error) {
                console.error("Erro:", error);
                alert('Erro de conexão com o servidor.');
            }
        }

        window.onload = carregarPedidos;
    </script>
</body>
</html>
