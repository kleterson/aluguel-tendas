<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | EventLux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header -->
        <div class="flex items-center justify-between glass p-6 rounded-2xl border border-gray-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-gauge text-white"></i>
                </div>
                <h1 class="text-xl font-extrabold text-white">Painel de Pedidos e Endereços</h1>
            </div>
            <button onclick="carregarPedidos()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-rotate"></i> <span>Atualizar Lista</span>
            </button>
        </div>

        <!-- Tabela de Pedidos -->
        <div class="glass rounded-2xl overflow-hidden border border-gray-800">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 text-xs uppercase bg-gray-900/50">
                            <th class="p-4">Data / Hora</th>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Contato (E-mail / CPF)</th>
                            <th class="p-4">Endereço de Montagem</th>
                            <th class="p-4">Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pedidos" class="divide-y divide-gray-800 text-sm">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500">Carregando pedidos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function carregarPedidos() {
            const tbody = document.getElementById('tabela-pedidos');
            tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">Buscando dados...</td></tr>`;

            try {
                const response = await fetch('/api/pedidos');
                const pedidos = await response.json();

                if (pedidos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">Nenhum pedido registrado até o momento.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                pedidos.reverse().forEach(p => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/30 transition">
                            <td class="p-4 text-gray-300 whitespace-nowrap">${p.data}</td>
                            <td class="p-4 font-bold text-white">${p.payer.name}</td>
                            <td class="p-4 text-gray-300">
                                <div>${p.payer.email}</div>
                                <div class="text-xs text-gray-500">CPF: ${p.payer.cpf}</div>
                            </td>
                            <td class="p-4 text-gray-300">
                                <div>${p.address.street}, ${p.address.number}</div>
                                <div class="text-xs text-indigo-400">CEP: ${p.address.cep}</div>
                            </td>
                            <td class="p-4 font-bold text-emerald-400 whitespace-nowrap">R$ ${p.transaction_amount.toFixed(2)}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar pedidos:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-400">Erro ao carregar os dados do servidor.</td></tr>`;
            }
        }

        window.onload = carregarPedidos;
    </script>
</body>
</html>
